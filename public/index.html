<script>
  (function() {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<style>
:root,:root[data-theme="light"]{color-scheme:light;--bg:#f8fafc;--bg-gradient:radial-gradient(circle at top left,rgba(15,118,110,.07),transparent 40%),radial-gradient(circle at right 20%,rgba(2,132,199,.05),transparent 35%),linear-gradient(180deg,#f8fafc 0%,#eef2f6 100%);--panel:rgba(255,255,255,.85);--panel-border:rgba(15,23,42,.06);--text:#0f172a;--text-muted:#475569;--primary:#0f766e;--primary-hover:#0d9488;--primary-strong:#115e59;--primary-glow:rgba(15,118,110,.15);--danger:#b91c1c;--shadow:0 20px 50px rgba(15,23,42,.05);--card-shadow:0 4px 20px rgba(15,23,42,.03);--input-bg:#fff;--input-border:#cbd5e1;--input-focus:#0f766e;--btn-ghost-bg:#e2e8f0;--btn-ghost-hover:#cbd5e1;--table-header-bg:#f8fafc;--table-border:#e2e8f0;--table-row-hover:#f1f5f9;--row-selected-bg:rgba(15,118,110,.07);--warn-bg:rgba(217,119,6,.1);--warn-border:rgba(217,119,6,.3);--warn-text:#b45309;--modal-mask:rgba(15,23,42,.45);--modal-shadow:0 24px 60px rgba(15,23,42,.18)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0f19;--bg-gradient:radial-gradient(circle at top left,rgba(20,184,166,.1),transparent 45%),radial-gradient(circle at right 20%,rgba(14,165,233,.06),transparent 40%),linear-gradient(180deg,#0b0f19 0%,#030712 100%);--panel:rgba(17,24,39,.85);--panel-border:rgba(255,255,255,.08);--text:#f1f5f9;--text-muted:#94a3b8;--primary:#14b8a6;--primary-hover:#2dd4bf;--primary-strong:#99f6e4;--primary-glow:rgba(20,184,166,.25);--danger:#ef4444;--shadow:0 20px 50px rgba(0,0,0,.3);--card-shadow:0 4px 20px rgba(0,0,0,.2);--input-bg:#1e293b;--input-border:#334155;--input-focus:#14b8a6;--btn-ghost-bg:#334155;--btn-ghost-hover:#475569;--table-header-bg:#1e293b;--table-border:#334155;--table-row-hover:#1e293b;--row-selected-bg:rgba(20,184,166,.12);--warn-bg:rgba(251,191,36,.15);--warn-border:rgba(251,191,36,.35);--warn-text:#fbbf24;--modal-mask:rgba(0,0,0,.55);--modal-shadow:0 24px 60px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Inter',ui-sans-serif,system-ui,sans-serif;color:var(--text);background:var(--bg-gradient);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.shell{width:min(1200px,calc(100vw - 24px));margin:0 auto;padding:16px 0 90px}

.header{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;align-items:center;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand .cloud-logo{display:block;width:24px;height:24px;flex-shrink:0;border-radius:6px;overflow:hidden;transform:translateY(-2px)}
.brand-title{font-family:'Outfit',sans-serif;font-weight:800;font-size:18px;line-height:24px;letter-spacing:-.02em;color:var(--primary);white-space:nowrap}
.brand-sub{font-size:13px;line-height:24px;color:var(--text-muted);white-space:nowrap}
.header-right{display:flex;gap:6px;align-items:center;justify-content:flex-end}

.theme-toggle{width:34px;height:34px;border-radius:10px;border:1px solid var(--panel-border);background:var(--panel);color:var(--text);cursor:pointer;box-shadow:var(--card-shadow);display:inline-flex;align-items:center;justify-content:center;padding:0;outline:none;transition:all .2s;position:relative}
.theme-toggle:hover{background:var(--table-row-hover)}
.theme-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s,opacity .2s}
:root[data-theme="dark"] .sun-icon{opacity:1;transform:rotate(0) scale(1)}
:root[data-theme="dark"] .moon-icon{opacity:0;transform:rotate(90deg) scale(0);position:absolute}
:root[data-theme="light"] .sun-icon{opacity:0;transform:rotate(-90deg) scale(0);position:absolute}
:root[data-theme="light"] .moon-icon{opacity:1;transform:rotate(0) scale(1)}

.github-corner{position:absolute;top:0;right:0;z-index:1;line-height:0;display:block}
.github-corner svg{width:88px;height:88px;border:0;display:block}
.github-corner .gh-bg{fill:var(--primary);transition:fill .3s}
.github-corner .gh-arm,.github-corner .gh-body{fill:#fff}
.github-corner:hover .gh-bg{fill:var(--primary-hover)}
.github-corner:hover .gh-arm{animation:octocat-wave 560ms ease-in-out}
@keyframes octocat-wave{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-25deg)}40%,80%{transform:rotate(10deg)}}

.card{padding:16px;border:1px solid var(--panel-border);border-radius:16px;background:var(--panel);box-shadow:var(--card-shadow);backdrop-filter:blur(16px)}
.card-title{font-family:'Outfit',sans-serif;font-weight:700;font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card-title svg{width:15px;height:15px;color:var(--primary);flex-shrink:0}
.grid-top{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;margin-bottom:12px}
.search-panel{display:flex;flex-direction:column;gap:10px}
.search-row{display:flex;gap:8px}
.search-row input{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--input-border);border-radius:10px;font-family:inherit;font-size:14px;background:var(--input-bg);color:var(--text);outline:none;transition:all .2s}
.search-row input:focus{border-color:var(--input-focus);box-shadow:0 0 0 3px var(--primary-glow)}
.search-row input::placeholder{color:var(--text-muted);opacity:.6}
.search-row button{flex-shrink:0;padding:10px 20px}
.search-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.search-options select{padding:8px 10px;font-size:12.5px;border:1px solid var(--input-border);border-radius:9px;background:var(--input-bg);color:var(--text);font-family:inherit;cursor:pointer;outline:none;min-width:0}
.search-options select:focus{border-color:var(--input-focus)}

.rate-limit{margin-top:4px;padding:10px 12px;background:var(--table-row-hover);border:1px solid var(--panel-border);border-radius:10px}
.rate-limit-bar{position:relative;width:100%;height:26px;background:var(--input-border);border-radius:999px;overflow:hidden}
.rate-limit-bar + .rate-limit-bar{margin-top:8px}
.rate-limit-fill{position:absolute;top:0;left:0;height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),#0891b2);transition:width .4s cubic-bezier(.4,0,.2,1), background .3s}
.rate-limit-fill.low{background:linear-gradient(90deg,#d97706,#f59e0b)}
.rate-limit-fill.critical{background:linear-gradient(90deg,#dc2626,#ef4444);animation:rate-pulse 1s ease-in-out infinite}
@keyframes rate-pulse{0%,100%{box-shadow:inset 0 0 0 rgba(239,68,68,0)}50%{box-shadow:inset 0 0 16px rgba(239,68,68,.95)}}
.rate-limit-label{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:11.5px;font-weight:700;color:var(--text);pointer-events:none;z-index:2;letter-spacing:.04em;font-family:'Outfit',sans-serif}
.rate-limit-label span:last-child{font-family:'JetBrains Mono',monospace;letter-spacing:0;font-weight:600}
.rate-limit-label span{text-shadow:0 1px 2px rgba(255,255,255,.6)}
:root[data-theme="dark"] .rate-limit-label span{text-shadow:0 1px 3px rgba(0,0,0,.75)}
.rate-limit-hint{font-size:11px;color:var(--text-muted);margin-top:8px}

.detail-panel{display:flex;flex-direction:column}
.detail-close{
  display:none;
  margin-left:auto;
  background:transparent;border:0;color:var(--text-muted);
  cursor:pointer;padding:0;border-radius:6px;
  width:24px;height:24px;
  align-items:center;justify-content:center;
  transition:all .2s;
}
.detail-close:hover{background:var(--table-row-hover);color:var(--text)}
.detail-close svg{width:14px;height:14px;flex-shrink:0}
.detail-empty{flex:1;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-muted);font-size:13px;border:1px dashed var(--panel-border);border-radius:12px;padding:20px}
.detail-empty .empty-emoji{width:40px;height:40px;color:var(--primary);opacity:.5}
.detail-empty .empty-emoji svg{width:100%;height:100%}
.detail{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.detail .cover{width:100px;height:100px;border-radius:14px;object-fit:cover;box-shadow:var(--card-shadow);border:1px solid var(--panel-border);background:var(--table-row-hover);flex:0 0 auto}
.detail .cover.ph{display:flex;align-items:center;justify-content:center;color:var(--primary);opacity:.5}
.detail .cover.ph svg{width:38px;height:38px}
.detail-info{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px}
.detail-name{font-family:'Outfit',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.detail-artist{color:var(--text-muted);font-size:13px;display:flex;align-items:center;gap:5px}
.detail-artist svg{width:13px;height:13px;flex-shrink:0}
.detail-badges{display:flex;gap:5px;flex-wrap:wrap}
.listen-tip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--primary-glow);border:1px solid var(--panel-border);color:var(--text-muted);font-size:12px;line-height:1.4}
.listen-tip svg{width:14px;height:14px;flex-shrink:0;color:var(--primary)}
.listen-tip.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text)}
.listen-tip.warn svg{color:var(--warn-text)}
.upload-row{display:flex;gap:8px}
.upload-row button{flex:1}
.lrc-wrap{margin-top:12px;padding:12px;background:var(--table-row-hover);border:1px solid var(--panel-border);border-radius:12px;max-height:150px;overflow:auto}
.lrc-line{color:var(--text-muted);font-size:12.5px;line-height:2}
.results-card{padding:16px}

.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--panel-border);align-items:center}
.tab{background:transparent;color:var(--text-muted);padding:9px 16px;border-radius:10px 10px 0 0;font-size:13.5px;border-bottom:2px solid transparent;box-shadow:none;display:inline-flex;align-items:center;gap:6px}
.tab svg{width:14px;height:14px;flex-shrink:0}
.tab:hover{transform:none;color:var(--text);background:var(--table-row-hover)}
.tab.active{color:var(--primary-strong);border-bottom-color:var(--primary);background:var(--primary-glow)}
.tabs-spacer{flex:1}
.tabs-deploy{margin-bottom:2px;margin-left:6px}
.tabs-deploy.dirty{animation:tabs-deploy-pulse 2s ease-in-out infinite}
@keyframes tabs-deploy-pulse{0%,100%{box-shadow:0 4px 14px var(--primary-glow)}50%{box-shadow:0 4px 22px rgba(16,185,129,.6)}}

button{appearance:none;border:0;border-radius:10px;padding:10px 18px;font-family:'Outfit',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1;white-space:nowrap}
button svg{width:14px;height:14px;flex-shrink:0}
button:hover{transform:translateY(-1.5px)}
button:active{transform:scale(.97)}
button:disabled{cursor:not-allowed;transform:none!important;opacity:.55}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--primary),#0891b2);box-shadow:0 4px 14px var(--primary-glow)}
.btn-primary:hover{background:linear-gradient(135deg,var(--primary-hover),#0e7490)}
.btn-ghost{color:var(--text);background:var(--btn-ghost-bg)}
.btn-ghost:hover{background:var(--btn-ghost-hover)}
.btn-danger{color:#fff;background:linear-gradient(135deg,var(--danger),#dc2626)}
.btn-success{color:#fff;background:linear-gradient(135deg,#10b981,#059669)}
.btn-success:hover{background:linear-gradient(135deg,#34d399,#10b981)}
.btn-uploaded{color:#059669!important;background:rgba(16,185,129,.15)!important;border:1px solid rgba(16,185,129,.45)!important;cursor:default!important;box-shadow:none!important}
.btn-uploaded:hover{transform:none!important;background:rgba(16,185,129,.15)!important}
:root[data-theme="dark"] .btn-uploaded{color:#34d399!important;background:rgba(16,185,129,.18)!important;border-color:rgba(16,185,129,.5)!important}
.btn-too-big{color:var(--text-muted)!important;background:var(--btn-ghost-bg)!important;border:1px solid var(--panel-border)!important;cursor:not-allowed!important;box-shadow:none!important;opacity:.75}
.btn-too-big:hover{transform:none!important;background:var(--btn-ghost-bg)!important}
.btn-xs{padding:6px 12px;font-size:12px;border-radius:8px;gap:4px}
.btn-xs svg{width:12px;height:12px}
.table-wrap{overflow:auto;border:1px solid var(--panel-border);border-radius:12px;background:var(--input-bg);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:640px}
thead{background:var(--table-header-bg);position:sticky;top:0;z-index:1}
th,td{padding:10px 12px;border-bottom:1px solid var(--table-border);text-align:left;vertical-align:middle;font-size:12.5px}
th{font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
tbody tr{transition:background .2s;cursor:pointer}
tbody tr:hover{background:var(--table-row-hover)}
tbody tr.selected{background:var(--row-selected-bg);box-shadow:inset 3px 0 0 var(--primary)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;word-break:break-all}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:600;line-height:1;border:1px solid transparent}
.badge-src{background:var(--primary-glow);color:var(--primary-strong);border-color:var(--panel-border)}
.badge-idle{background:rgba(100,116,139,.1);color:#475569;border-color:rgba(100,116,139,.15)}
:root[data-theme="dark"] .badge-idle{background:rgba(148,163,184,.15);color:#cbd5e1}
.pagination{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--table-border)}
.pagination .page-info{font-size:12.5px;color:var(--text-muted);font-family:'JetBrains Mono',ui-monospace,monospace;min-width:72px;text-align:center}
.login-overlay{position:fixed;inset:0;z-index:1500;display:flex;align-items:center;justify-content:center;background:var(--bg-gradient);padding:24px}
.login-overlay.hidden{display:none}
.login-box{width:100%;max-width:380px;padding:32px 28px;background:var(--panel);border:1px solid var(--panel-border);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.login-box h2{font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:8px}
.login-box h2 svg{flex-shrink:0;border-radius:7px;display:block;transform:translateY(-2px)}
.login-box p{color:var(--text-muted);font-size:13px;margin-bottom:22px;line-height:1.6;text-align:center}
.login-box .field{margin-bottom:12px}
.login-box .field input{width:100%;padding:11px 14px;border:1px solid var(--input-border);border-radius:10px;background:var(--input-bg);color:var(--text);font-family:inherit;font-size:14px;outline:none}
.login-box .field input:focus{border-color:var(--input-focus);box-shadow:0 0 0 3px var(--primary-glow)}
.login-box .err{display:none;padding:10px 14px;border-radius:10px;background:rgba(185,28,28,.1);border:1px solid rgba(185,28,28,.2);color:var(--danger);font-size:13px;margin-bottom:14px}
.login-box .err.show{display:block}
.muted{color:var(--text-muted);font-size:12.5px}
.empty{padding:20px;text-align:center;color:var(--text-muted);font-size:13px}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.banner{display:none;padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:600;line-height:1.5;margin-bottom:10px;align-items:center;gap:8px}
.banner.show{display:flex}
.banner.warn{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text)}
.banner.error{background:rgba(185,28,28,.1);border:1px solid rgba(185,28,28,.3);color:var(--danger)}
:root[data-theme="dark"] .banner.error{background:rgba(239,68,68,.15);color:#fca5a5}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(24px);padding:11px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--panel-border);color:var(--text);font-size:13.5px;font-weight:600;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;visibility:hidden;pointer-events:none;transition:transform .3s ease,opacity .25s ease,visibility 0s linear .3s;z-index:1600;max-width:90vw}
.toast.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0);transition:transform .3s ease,opacity .25s ease,visibility 0s linear 0s}
.toast.success{border-color:rgba(16,185,129,.3)}
.toast.error{border-color:rgba(239,68,68,.3);color:var(--danger)}
.site-footer{text-align:center;font-size:11.5px;color:var(--text-muted);padding-top:18px;line-height:1.7}
.site-footer a{color:var(--primary);text-decoration:none}
.site-footer a:hover{text-decoration:underline}

.modal-overlay{position:fixed;inset:0;z-index:1800;display:flex;align-items:center;justify-content:center;background:var(--modal-mask);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:24px;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s}
.modal-overlay.show{opacity:1;visibility:visible;transition:opacity .25s ease,visibility 0s linear 0s}
.modal-box{width:100%;max-width:400px;padding:22px 22px 18px;background:var(--panel);border:1px solid var(--panel-border);border-radius:18px;box-shadow:var(--modal-shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transform:translateY(12px) scale(.97);transition:transform .3s cubic-bezier(.22,.61,.36,1)}
.modal-overlay.show .modal-box{transform:translateY(0) scale(1)}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:var(--primary-glow);color:var(--primary-strong);flex-shrink:0}
.modal-icon svg{width:16px;height:16px}
.modal-icon.danger{background:rgba(239,68,68,.12);color:var(--danger)}
.modal-title{font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--text)}
.modal-msg{font-size:13.5px;line-height:1.65;color:var(--text-muted);white-space:pre-line;margin:0 0 18px 42px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}

@keyframes mp-soundwave{from{transform:scale(1);opacity:.9}to{transform:scale(var(--wave-scale,1.8));opacity:0}}
.music-player{position:fixed;left:20px;bottom:20px;z-index:1050;width:0;height:0}
.mp-panel{position:absolute;left:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--input-bg);border:1px solid var(--panel-border);box-shadow:var(--shadow);transform-origin:left bottom;transform:scale(1);opacity:1;pointer-events:auto;transition:transform 850ms cubic-bezier(.22,.61,.36,1),opacity .45s ease,border-radius .55s cubic-bezier(.22,.61,.36,1)}
.music-player.collapsed .mp-panel{transform:scale(.001);opacity:0;pointer-events:none;border-radius:50%;transition:transform 850ms cubic-bezier(.22,.61,.36,1),opacity .45s ease .40s,border-radius .7s cubic-bezier(.22,.61,.36,1) .30s}
.mp-shimmer{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.mp-shimmer::after{content:'';position:absolute;top:0;left:-150%;width:100%;height:100%;transform:skewX(-30deg);background:linear-gradient(to right,rgba(255,255,255,0) 0%,rgba(255,255,255,.05) 45%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.05) 55%,rgba(255,255,255,0) 100%);transition:left .6s cubic-bezier(.25,1,.5,1);pointer-events:none}
.mp-panel:hover .mp-shimmer::after{left:150%}
.mp-disc{position:relative;z-index:1;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;width:80px;height:80px;aspect-ratio:1/1}
.mp-disc-rotating{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;will-change:transform;backface-visibility:hidden}
.mp-disc-rotating::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 88deg,transparent 0%,rgba(255,255,255,.35) 8%,transparent 18%,transparent 50%,rgba(255,255,255,.35) 58%,transparent 68%);z-index:1;pointer-events:none}
.mp-disc-base{position:absolute;width:100%;height:100%;background:#1a1a1a;border-radius:50%;z-index:0}
.mp-disc-img{object-fit:cover;border-radius:50%;position:relative;z-index:2;aspect-ratio:1/1;backface-visibility:hidden;width:50px;height:50px}
.mp-info{position:relative;z-index:1;flex:0 0 auto;min-width:260px;display:flex;flex-direction:column;align-items:stretch}
.mp-track{display:flex;flex-direction:column}
.mp-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;color:var(--text)}
.mp-artist{font-size:11px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.mp-progress{display:flex;flex-direction:column;gap:4px;align-self:stretch;margin-top:6px}
.mp-bar{width:100%;height:4px;background:var(--progress-bg,rgba(0,0,0,.08));border-radius:2px;cursor:pointer;position:relative;overflow:hidden}
.mp-fill{height:100%;background:var(--progress-fill,var(--primary));border-radius:2px;width:0%;transition:width .1s linear}
.mp-time{display:flex;justify-content:space-between;font-size:11px;padding:0 2px;color:var(--text-muted)}
.mp-controls{display:flex;align-items:center;gap:8px;justify-content:center;align-self:stretch;margin-top:8px;flex-wrap:nowrap}
.mp-btn{background:transparent;border:1px solid var(--panel-border);color:var(--text-muted);cursor:pointer;padding:0;opacity:.85;transition:all .3s cubic-bezier(.23,1,.32,1);display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;outline:none}
.mp-btn:hover{opacity:1;transform:scale(1.08);border-color:var(--primary);background:var(--primary-glow);color:var(--primary-strong)}
.mp-btn.play{width:36px;height:36px;opacity:1;border-color:var(--primary);background:var(--primary-glow);color:var(--primary-strong)}
.mp-btn.active{border-color:var(--primary);background:var(--primary-glow);color:var(--primary-strong);opacity:1}
.mp-btn svg{width:60%;height:60%;position:relative;z-index:2;display:block}

.mp-vol-wrap{position:relative;display:flex;align-items:center;flex-shrink:0}
.mp-vol-slider{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(8px) scale(.9);transform-origin:50% 100%;padding:10px 12px;background:var(--input-bg);border:1px solid var(--panel-border);border-radius:12px;box-shadow:var(--shadow);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease, transform .28s cubic-bezier(.22,.61,.36,1), visibility 0s linear .28s;z-index:20;display:flex;align-items:center}
.mp-vol-slider.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1);transition:opacity .2s ease, transform .28s cubic-bezier(.22,.61,.36,1), visibility 0s linear 0s}
.mp-vol-slider input{width:110px;cursor:pointer;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;outline:none;background:linear-gradient(to right,var(--slider-fill,var(--primary)) 0%,var(--slider-fill,var(--primary)) var(--slider-pct,50%),var(--slider-bg,rgba(0,0,0,.08)) var(--slider-pct,50%),var(--slider-bg,rgba(0,0,0,.08)) 100%)}
.mp-vol-slider input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--slider-thumb,var(--primary));cursor:pointer}
.mp-vol-slider input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--slider-thumb,var(--primary));cursor:pointer;border:none}

.mp-ball{position:absolute;left:0;bottom:0;width:50px;height:50px;border-radius:50%;background:var(--input-bg);border:1px solid var(--panel-border);box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:visible;opacity:0;transform:scale(.7);pointer-events:none;transition:opacity .4s ease,transform .5s cubic-bezier(.22,.61,.36,1)}
.music-player.collapsed .mp-ball{opacity:1;transform:scale(1);pointer-events:auto;transition:opacity .5s ease .38s,transform .55s cubic-bezier(.22,.61,.36,1) .38s}
.music-player.collapsed .mp-ball.dim{opacity:.4;transition:opacity .5s ease}
.music-player.collapsed .mp-ball.dim:hover{opacity:1}
.mp-ball-inner{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;will-change:transform;backface-visibility:hidden}
.mp-ball-inner::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 88deg,transparent 0%,rgba(255,255,255,.35) 8%,transparent 18%,transparent 50%,rgba(255,255,255,.35) 58%,transparent 68%);z-index:1;pointer-events:none}
.mp-ball-base{position:absolute;inset:0;background:#1a1a1a;border-radius:50%;z-index:0}
.mp-ball-img{width:56%;height:56%;object-fit:cover;border-radius:50%;aspect-ratio:1/1;position:relative;z-index:2;display:none}
.mp-ball-overlay{position:absolute;inset:0;width:100%;height:100%;background:rgba(0,0,0,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;opacity:0;transition:opacity .3s ease;pointer-events:none;z-index:5}
.mp-ball:hover .mp-ball-overlay{opacity:1}
.mp-ball-overlay svg{width:18px;height:18px}
.mp-ball-waves{position:absolute;inset:0;pointer-events:none;z-index:-1}
.mp-ball-wave{position:absolute;inset:0;border-radius:50%;border:var(--wave-stroke,2.8px) solid var(--wave-color,rgba(0,0,0,.35));opacity:0;will-change:transform,opacity;transform:scale(1)}
.music-player.collapsed.playing .mp-ball-wave{animation:mp-soundwave var(--wave-speed,2.4s) infinite ease-out}
.mp-playlist{position:fixed;z-index:1052;width:280px;background:var(--input-bg);border-radius:12px;border:1px solid var(--panel-border);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;opacity:0;transform:scale(.95) translateY(10px);pointer-events:none;transition:all .3s cubic-bezier(.23,1,.32,1)}
.mp-playlist.show{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
.mp-pl-header{padding:12px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--panel-border);color:var(--text)}
.mp-pl-close{cursor:pointer;opacity:.6;transition:opacity .2s;display:flex;align-items:center;justify-content:center;color:var(--text)}
.mp-pl-close:hover{opacity:1}
.mp-pl-close svg{width:18px;height:18px}
.mp-pl-inner{max-height:260px;overflow-y:auto}
.mp-pl-item{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--panel-border);transition:background .2s;color:var(--text)}

</style>

<script>
// ============================================================

var GD_API = 'https://music-api.gdstudio.xyz/api.php';

  ytmusic: 'YouTube Music', spotify: 'Spotify'
};
function sourceLabel(s) { return SOURCE_LABELS[s] || s || '未知音源'; }

var state = {
  results: [], selected: null, library: [], uploaded: {}, sizeCache: {}, page: 1,
  dirty: false, changeCount: 0,
  unavailable: {}
};

function getToken() { return localStorage.getItem(AUTH_KEY) || ''; }
function setToken(t) { localStorage.setItem(AUTH_KEY, t); }
function clearToken() { localStorage.removeItem(AUTH_KEY); }
function songKey(s, id) { return (s || '') + ':' + id; }
function isTooBig(sizeBytes) { return sizeBytes && sizeBytes > MAX_UPLOAD_SIZE_BYTES; }
function sizeLabel(sizeBytes) { return (sizeBytes / 1024 / 1024).toFixed(1) + ' MB'; }
function isMobile() { return window.innerWidth <= 900; }
function escapeHtml(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtArtist(a) {
  if (Array.isArray(a)) return a.map(String).join('、');
  return a ? String(a) : '';
}

// ─── 脏标记 ─────────────────────────────
function loadDirtyState() {
  try {
    var raw = localStorage.getItem(DIRTY_KEY);
    if (!raw) { updateDeployBtn(); return; }
    var obj = JSON.parse(raw);
    state.dirty = !!obj.dirty;
    state.changeCount = parseInt(obj.count, 10) || 0;
  } catch (e) {}
  updateDeployBtn();
}
function saveDirtyState() {
  try {
    if (state.dirty) {
      localStorage.setItem(DIRTY_KEY, JSON.stringify({ dirty: true, count: state.changeCount }));
    } else {
      localStorage.removeItem(DIRTY_KEY);
    }
  } catch (e) {}
}
function markDirty(n) {
  state.dirty = true;
  state.changeCount = (state.changeCount || 0) + (n || 1);
  saveDirtyState();
  updateDeployBtn();
}
function clearDirty() {
  state.dirty = false;
  state.changeCount = 0;
  saveDirtyState();
  updateDeployBtn();
}
function updateDeployBtn() {
  var btn = $('saveDeployBtn');
  if (!btn) return;
  btn.disabled = !state.dirty;
  btn.classList.toggle('dirty', !!state.dirty);
  var span = btn.querySelector('span');
  if (span) {
    var baseText = window.innerWidth <= 640 ? '部署' : '保存并部署';
    span.textContent = state.dirty
      ? (baseText + (state.changeCount ? '（' + state.changeCount + '）' : ''))
      : baseText;
  }
  btn.title = state.dirty
    ? ('共 ' + state.changeCount + ' 项变更待部署')
    : '有未部署的变更时可用';
}
window.addEventListener('resize', updateDeployBtn);

async function detectPendingFromCDN() {
  if (!state.library.length) return 0;

  // 只检查最新的 5 首（library 末尾是最新上传）
  var checkCount = Math.min(5, state.library.length);
  var pending = 0;

  var checks = [];
  for (var i = state.library.length - 1; i >= state.library.length - checkCount; i--) {
    (function(s) {
      if (!s.url) return;
      checks.push(
        fetch(s.url, { method: 'HEAD', cache: 'no-store' })
          .then(function(resp) {
            var ct = (resp.headers.get('Content-Type') || '').toLowerCase();
            // text/html → SPA fallback，说明未部署
            if (!resp.ok || ct.indexOf('text/html') >= 0) return 1;
            return 0;
          })
          .catch(function() { return 0; })  // 网络错误视为不可判定，忽略
      );
    })(state.library[i]);
  }

  if (!checks.length) return 0;
  var results = await Promise.all(checks);
  for (var j = 0; j < results.length; j++) pending += results[j];
  return pending;
}

async function syncDirtyFromServer() {
  try {
    var pendingCount = await detectPendingFromCDN();

    if (pendingCount > 0) {
      // CDN 上还有未部署的歌 → 强制标记 dirty
      if (!state.dirty || state.changeCount !== pendingCount) {
        state.dirty = true;
        state.changeCount = pendingCount;
        saveDirtyState();
        updateDeployBtn();
        console.log('[sync] CDN 检测到 ' + pendingCount + ' 首未部署，已启用部署按钮');
      }
    } else {
      // CDN 上全部已部署 → 清除本地 dirty（用户可能在其他设备部署过）
      if (state.dirty) {
        console.log('[sync] CDN 已全部部署，清除本地 dirty');
        clearDirty();
      }
    }
  } catch (e) {
    console.warn('[sync] 检测失败：', e);
  }
}

// ─── 通用确认弹窗 ────────────────────────
var _modalOpen = false;
function showConfirm(message, opts) {
  opts = opts || {};
  return new Promise(function(resolve) {
    if (_modalOpen) { resolve(false); return; }
    _modalOpen = true;

    var overlay = $('modalOverlay');
    var iconEl  = $('modalIcon');
    var titleEl = $('modalTitle');
    var msgEl   = $('modalMsg');
    var okBtn   = $('modalOk');
    var cancelBtn = $('modalCancel');

    titleEl.textContent = opts.title || '确认操作';
    msgEl.innerHTML     = String(message || '');
    okBtn.textContent   = opts.okText || '确定';
    cancelBtn.textContent = opts.cancelText || '取消';
    cancelBtn.style.display = '';

    iconEl.className = 'modal-icon' + (opts.danger ? ' danger' : '');
    iconEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
    okBtn.className  = 'modal-ok' + (opts.danger ? ' danger' : '');

    overlay.setAttribute('aria-hidden', 'false');
    void overlay.offsetWidth;
    overlay.classList.add('show');

    function cleanup() {
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onOverlay);
      document.removeEventListener('keydown', onKey);
      _modalOpen = false;
    }
    function close(result) { cleanup(); resolve(result); }
    function onOk() { close(true); }
    function onCancel() { close(false); }
    function onOverlay(e) { if (e.target === overlay) close(false); }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(false); }
      else if (e.key === 'Enter') { e.preventDefault(); close(true); }
    }

    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('click', onOverlay);
    document.addEventListener('keydown', onKey);

    setTimeout(function() { try { okBtn.focus(); } catch (_) {} }, 60);
  });
}

// ─── 进度弹窗 ─────────────────────────
function progItem(type, text) {
  var svgSpin  = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
  var svgCheck = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var svgX     = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  var svgDot   = '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/></svg>';
  var icon;
  if (type === 'running') icon = '<span class="progress-icon running">' + svgSpin  + '</span>';
  else if (type === 'done') icon = '<span class="progress-icon done">'    + svgCheck + '</span>';
  else if (type === 'err')  icon = '<span class="progress-icon err">'     + svgX     + '</span>';
  else                      icon = '<span class="progress-icon">'         + svgDot   + '</span>';
  return '<div class="progress-item">' + icon + '<span class="progress-text">' + text + '</span></div>';
}

function openProgressModal() {
  var overlay = $('modalOverlay');
  var iconEl  = $('modalIcon');
  var titleEl = $('modalTitle');
  var msgEl   = $('modalMsg');
  var okBtn   = $('modalOk');
  var cancelBtn = $('modalCancel');

  titleEl.textContent = '处理中…';
  msgEl.innerHTML     = '<div class="progress-list"></div>';
  iconEl.className    = 'modal-icon spin';
  iconEl.innerHTML    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
  okBtn.style.display     = 'none';
  cancelBtn.style.display = 'none';

  overlay.setAttribute('aria-hidden', 'false');
  void overlay.offsetWidth;
  overlay.classList.add('show');

  function cleanup() {
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden', 'true');
    okBtn.removeEventListener('click', onOk);
    cancelBtn.style.display = '';
    _modalOpen = false;
  }
  function onOk() { cleanup(); }
  _modalOpen = true;

  return {
    update: function(html) {
      var list = msgEl.querySelector('.progress-list');
      if (list) list.innerHTML = html;
    },
    finish: function(opts) {
      opts = opts || {};
      titleEl.textContent = opts.title || '完成';
      msgEl.innerHTML     = '<div class="progress-list">' + (opts.message || '') + '</div>';
      iconEl.className    = 'modal-icon' + (opts.type === 'error' ? ' danger' : '');
      if (opts.type === 'error') {
        iconEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      } else {
        iconEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      }
      okBtn.style.display = '';
      okBtn.disabled      = false;
      okBtn.textContent   = opts.buttonText || '完成';
      okBtn.className     = 'modal-ok' + (opts.type === 'error' ? ' danger' : '');
      okBtn.addEventListener('click', onOk);
      try { okBtn.focus(); } catch (_) {}
    }
  };
}

// ─── 友好错误提示 ───────────────────────────
function friendlyError(e) {
  var msg = String((e && e.message) || e || '');
  var low = msg.toLowerCase();

  if (/文件写入冲突|并发冲突/i.test(msg) ||
      (/github\s+(put|delete)/i.test(msg) && /409/.test(msg)) ||
      /is at .* but expected/i.test(msg)) {
    return '文件写入冲突（另一个上传正在进行中），请等 3-5 秒后重试';
  }

  if (/github\s+(put|delete|get)\s+/i.test(msg)) {
    return 'GitHub 写入失败，请稍后重试：' + msg.slice(0, 100);
  }

  if (/429|403|频率|限制|限流|配额|rate\s*limit|forbidden|forbidd/i.test(low)) {
    return '音乐服务请求过于频繁，请等待约 1-2 分钟后重试';
  }
  if (/50[0-9]|service\s*temporarily|unknown\s*error|bad\s*gateway|upstream/i.test(low)) {
    return '上游音乐服务正在维护中，请稍后重试';
  }
  if (/failed to fetch|networkerror|cors|load failed|网络/i.test(low)) {
    return '网络连接异常，请检查网络后重试';
  }
  if (/401|unauthorized|登录已失效/i.test(low)) {
    return '登录已失效，请重新登录';
  }
  return msg || '加载失败，请稍后重试';
}

// ─── 配额 ─────────────────────────
function rateRead() {
  try {
    var raw = localStorage.getItem(RATE.KEY);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    var now = Date.now();
    return arr.filter(function(t) { return typeof t === 'number' && (now - t) < RATE.WINDOW; });
  } catch (e) { return []; }
}
function rateWrite(arr) { try { localStorage.setItem(RATE.KEY, JSON.stringify(arr)); } catch (e) {} }
function rateRemaining() { return Math.max(0, RATE.LIMIT - rateRead().length); }
function rateConsume(n) {
  n = n || 1;
  var arr = rateRead(); var now = Date.now();
  for (var i = 0; i < n; i++) arr.push(now);
  rateWrite(arr); updateRateUI();
}
function rateResetInSec() {
  var arr = rateRead(); if (!arr.length) return 0;
  var earliest = Math.min.apply(null, arr);
  return Math.max(0, Math.ceil((earliest + RATE.WINDOW - Date.now()) / 1000));
}

function workerRead() {
  try {
    var raw = localStorage.getItem(W_RATE.KEY);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    var now = Date.now();
    return arr.filter(function(t) { return typeof t === 'number' && (now - t) < W_RATE.WINDOW; });
  } catch (e) { return []; }
}
function workerWrite(arr) { try { localStorage.setItem(W_RATE.KEY, JSON.stringify(arr)); } catch (e) {} }
function workerConsume(n) {
  n = n || 1;
  var arr = workerRead(); var now = Date.now();
  for (var i = 0; i < n; i++) arr.push(now);
  workerWrite(arr); updateRateUI();
}
function workerResetInSec() {
  var arr = workerRead(); if (!arr.length) return 0;
  var earliest = Math.min.apply(null, arr);
  return Math.max(0, Math.ceil((earliest + W_RATE.WINDOW - Date.now()) / 1000));
}

function updateRateUI() {
  var remaining = rateRemaining();
  var pct = (remaining / RATE.LIMIT) * 100;
  var text = $('rateLimitText'); var fill = $('rateLimitFill');
  if (text) text.textContent = remaining + ' / ' + RATE.LIMIT;
  if (fill) {
    fill.style.width = pct + '%';
    fill.classList.toggle('low', remaining <= 15 && remaining > 5);
    fill.classList.toggle('critical', remaining <= 5);
  }

  var wRemaining = Math.max(0, W_RATE.LIMIT - workerRead().length);
  var wPct = (wRemaining / W_RATE.LIMIT) * 100;
  var wText = $('workerText'); var wFill = $('workerFill');
  if (wText) wText.textContent = wRemaining + ' / ' + W_RATE.LIMIT;
  if (wFill) {
    wFill.style.width = wPct + '%';
    wFill.classList.toggle('low', wRemaining <= 18 && wRemaining > 6);
    wFill.classList.toggle('critical', wRemaining <= 6);
  }

  var hint = $('rateLimitHint');
  if (hint) {
    var parts = ['上次路径：' + lastPath];
    if (remaining === 0) {
      parts.push('浏览器配额已耗尽，期间自动走 Worker（约 ' + rateResetInSec() + 's 后恢复）');
    }
    hint.textContent = parts.join(' · ');
  }
}

// ─── Worker API ─────────────────────────
async function api(path, method, body) {
  var opts = { method: method || 'GET', headers: {} };
  var pwd = getToken(); if (pwd) opts.headers['X-Auth-Token'] = pwd;
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  var r = await fetch('/api' + path, opts);
  if (r.status === 401) { clearToken(); showLogin(); throw new Error('登录已失效'); }
  var data = await r.json().catch(function() { return {}; });
  if (!r.ok || (data && data.ok === false)) throw new Error((data && data.error) || ('HTTP ' + r.status));
  return data;
}

// ─── GD API：主动负载均衡 ─────────────
var LB = {
  KEY: 'cf-music-lb-counter',
  RATIO_DIRECT: 1,
  RATIO_TOTAL: 2,
  read: function() {
    try { var n = parseInt(localStorage.getItem(this.KEY) || '0', 10); return isNaN(n) ? 0 : n; }
    catch (e) { return 0; }
  },
  write: function(n) { try { localStorage.setItem(this.KEY, String(n)); } catch (e) {} },
  pick: function() {
    var n = this.read();
    var slot = n % this.RATIO_TOTAL;
    this.write((n + 1) % 1000000);
    return slot < this.RATIO_DIRECT ? 'direct' : 'worker';
  }
};

function parseGdResponse(text) {
  var data;
  try { data = JSON.parse(text); }
  catch (e) {
    var t = text.toLowerCase();
    if (t.indexOf('rate') >= 0 || t.indexOf('limit') >= 0 ||
        t.indexOf('频率') >= 0 || t.indexOf('限制') >= 0) {
      throw new Error('频率限制：GD API 5 分钟内不超 50 次请求，请稍后重试');
    }
    throw new Error('音乐 API 返回异常：' + text.slice(0, 120));
  }
  if (data && typeof data === 'object' && !Array.isArray(data)) {
    var err = data.error || data.message;
    if (err && typeof err === 'string') {
      var el = err.toLowerCase();
      if (el.indexOf('rate') >= 0 || el.indexOf('limit') >= 0 ||
          err.indexOf('频率') >= 0 || err.indexOf('限制') >= 0) {
        throw new Error('频率限制：GD API 5 分钟内不超 50 次请求，请稍后重试');
      }
    }
  }
  return data;
}

function gdFetchDirect(params) {
  var url = new URL(GD_API);
  for (var k in params) {
    if (params[k] !== undefined && params[k] !== null && params[k] !== '') {
      url.searchParams.set(k, String(params[k]));
    }
  }
  return fetch(url.toString(), {
    headers: { 'Referer': 'https://music.gdstudio.xyz/' },
  }).then(function(resp) {
    if (!resp.ok) {
      if (resp.status === 429) throw new Error('频率限制：GD API 5 分钟内不超 50 次请求，请稍后重试');
      if (resp.status === 403) throw new Error('访问被拒绝（可能已超过 GD API 频率限制）');
      if (resp.status >= 500) throw new Error('音乐 API 服务器错误 (' + resp.status + ')');
      throw new Error('音乐 API 错误 ' + resp.status);
    }
    return resp.text();
  }).then(function(text) {
    var data = parseGdResponse(text);
    rateConsume(1);
    return data;
  });
}

function gdFetchViaWorker(params) {
  var pwd = getToken();
  var headers = { 'Content-Type': 'application/json' };
  if (pwd) headers['X-Auth-Token'] = pwd;
  return fetch('/api/gd', {
    method: 'POST',
    headers: headers,
    body: JSON.stringify({ params: params }),
  }).then(function(resp) {
    if (resp.status === 401) { clearToken(); showLogin(); throw new Error('登录已失效'); }
    if (resp.status === 429) throw new Error('Worker 代理配额已用尽，请稍后重试');
    if (!resp.ok) {
      return resp.text().then(function(t) {
        throw new Error('Worker 代理失败 (' + resp.status + ')' + (t ? ': ' + t.slice(0, 120) : ''));
      });
    }
    return resp.text();
  }).then(function(text) {
    var data = parseGdResponse(text);
    workerConsume(1);
    return data;
  });
}

function gdFetch(params) {
  var preferred = LB.pick();
  if (rateRemaining() <= 0) preferred = 'worker';

  var primary, backup, primaryName, backupName;
  if (preferred === 'direct') {
    primary = gdFetchDirect;     primaryName = 'direct';
    backup  = gdFetchViaWorker;  backupName  = 'worker';
  } else {
    primary = gdFetchViaWorker;  primaryName = 'worker';
    backup  = gdFetchDirect;     backupName  = 'direct';
  }

  return primary(params).then(function(data) {
    lastPath = (primaryName === 'direct' ? '直连' : 'Worker');
    updateRateUI();
    return data;
  }).catch(function(e) {
    return backup(params).then(function(data) {
      lastPath = (backupName === 'direct' ? '直连' : 'Worker') + '（回退）';
      updateRateUI();
      try { console.warn('[gd] ' + primaryName + ' 失败，已切换到 ' + backupName + '：', e.message); } catch (_) {}
      return data;
    }).catch(function(e2) {
      lastPath = '全部失败';
      updateRateUI();
      try { console.error('[gd] 所有通道均失败', { primary: e.message, backup: e2.message }); } catch (_) {}
      throw new Error(
        primaryName + ' 失败：' + e.message + ' / ' +
        backupName + ' 也失败：' + e2.message
      );
    });
  });
}

function gdSearch(source, keyword, page) {
  return gdFetch({ types: 'search', source: source, name: keyword, count: 10, pages: page || 1 }).then(function(data) {
    if (Array.isArray(data)) return data;
    if (data && typeof data === 'object') {
      var keys = ['data', 'result', 'songs', 'list'];
      for (var i = 0; i < keys.length; i++) if (Array.isArray(data[keys[i]])) return data[keys[i]];
    }
    return [];
  });
}

function gdGetUrl(source, trackId, br) {
  return gdFetch({ types: 'url', source: source, id: trackId, br: br || '320' }).then(function(d) {
    if (!d) return { url: null, size: 0, br: -1, unavailable: true };
    var brVal = parseInt(d.br, 10);
    var url   = d.url ? String(d.url) : '';
    if (!url || brVal === -1) {
      return { url: null, size: 0, br: isNaN(brVal) ? -1 : brVal, unavailable: true };
    }
    return { url: url, size: parseInt(d.size, 10) || 0, br: brVal };
  }).catch(function(e) {
    return { url: null, size: 0, br: -1, unavailable: true, error: e };
  });
}
function gdGetPic(source, picId) {
  if (!picId) return Promise.resolve(null);
  return gdFetch({ types: 'pic', source: source, id: picId, size: 500 }).then(function(d) { return d && d.url ? d.url : null; }).catch(function() { return null; });
}
function gdGetLyric(source, lyricId) {
  if (!lyricId) return Promise.resolve({ lyric: '', tlyric: '' });
  return gdFetch({ types: 'lyric', source: source, id: lyricId }).then(function(d) {
    return { lyric: (d && d.lyric) || '', tlyric: (d && d.tlyric) || '' };
  }).catch(function() { return { lyric: '', tlyric: '' }; });
}
function gdTrackAll(source, trackId, picId, lyricId, br) {
  return Promise.all([
    gdGetUrl(source, trackId, br),
    gdGetPic(source, picId),
    gdGetLyric(source, lyricId),
  ]).then(function(arr) {
    return {
      url: arr[0].url,
      size: arr[0].size,
      br: arr[0].br,
      unavailable: !!arr[0].unavailable,
      pic_url: arr[1],
      lyric: arr[2].lyric,
      tlyric: arr[2].tlyric,
    };
  });
}

function qualityBr() {
  var map = { '128K': '128', '192K': '192', '320K': '320', '16bit 无损': '740', '24bit 无损': '999' };
  return map[$('qualitySel').value] || '320';
}

async function doSearch(page) {
  var kw = $('kwInput').value.trim();
  if (!kw) { toast('请输入关键词', 'error'); return; }
  state.page = (typeof page === 'number' && page > 0) ? page : 1;

  switchToResultsTab();

  hideBanner();
  var searchBtn = $('searchBtn');
  searchBtn.disabled = true;
  searchBtn.innerHTML = SVG.magnifier + '<span>搜索中…</span>';
  $('searchStatus').textContent = '正在搜索…';
  state.selected = null;
  $('detailEmpty').style.display = ''; $('detailContent').style.display = 'none'; $('lyricBox').innerHTML = '';

  try {
    var results = await gdSearch($('sourceSel').value, kw, state.page);
    state.results = results || [];
    renderSearch();
  } catch (e) {
    console.error('[search] 原始错误:', e);
    var friendly = friendlyError(e);
    var isRate = /频率|限制|限流|配额|rate|429|403/i.test(e.message || '');
    showBanner(isRate ? 'warn' : 'error', friendly);
    $('searchStatus').textContent = isRate ? '请求受限，请稍后再试' : '';
    if (!state.results.length) {
      $('searchBody').innerHTML = '<tr><td colspan="6" class="empty">' + friendly + '</td></tr>';
      updatePager();
    }
  } finally {
    searchBtn.disabled = false;
    searchBtn.innerHTML = SVG.magnifier + '<span>搜索</span>';
  }
}

function updatePager() {
  var pager = $('searchPager');
  if (!pager) return;
  if (!state.results.length) { pager.style.display = 'none'; return; }
  pager.style.display = 'flex';
  $('pageInfo').textContent = '第 ' + state.page + ' 页';
  $('prevPageBtn').disabled = state.page <= 1;
  $('nextPageBtn').disabled = state.results.length < 10;
}

function renderSearch() {
  var tb = $('searchBody');
  if (!state.results.length) {
    tb.innerHTML = '<tr><td colspan="6" class="empty">没有找到结果</td></tr>';
    $('searchStatus').textContent = '无结果';
    updatePager(); return;
  }
  $('searchStatus').textContent = '找到 ' + state.results.length + ' 首（每页 10 条），点击行查看详情';
  var html = '';
  state.results.forEach(function(r, i) {
    var src = r.source || '';
    var key = songKey(src, r.id);
    var isUp = !!state.uploaded[key];
    var sz = state.sizeCache[key];
    var uploadBtn;
    if (isUp) {
      uploadBtn = '<button class="btn-uploaded btn-xs" disabled>' + SVG.check + '<span>已上传</span></button>';
    } else if (state.unavailable[key]) {
      uploadBtn = '<button class="btn-too-big btn-xs" disabled title="该音源未返回音频（可能是音质不支持或曲目受限）">' + SVG.upload + '<span>无音频</span></button>';
    } else if (isTooBig(sz)) {
      uploadBtn = '<button class="btn-too-big btn-xs" disabled title="' + sizeLabel(sz) + '，超过 ' + MAX_UPLOAD_SIZE_MB + ' MB 上限">' + SVG.upload + '<span>过大</span></button>';
    } else {
      uploadBtn = '<button class="btn-success btn-xs" data-act="upload" data-idx="' + i + '">' + SVG.upload + '<span>上传</span></button>';
    }
    html += '<tr data-idx="' + i + '">' +
      '<td>' + (i + 1) + '</td>' +
      '<td class="song-cell">' +
        '<div class="song-title">' + escapeHtml(r.name) + '</div>' +
        '<div class="song-artist-m">' + escapeHtml(fmtArtist(r.artist)) + '</div>' +
      '</td>' +
      '<td>' + escapeHtml(fmtArtist(r.artist)) + '</td>' +
      '<td>' + escapeHtml(r.album || '') + '</td>' +
      '<td><span class="badge badge-src">' + escapeHtml(src) + '</span></td>' +
      '<td><button class="btn-ghost btn-xs" data-act="pick" data-idx="' + i + '">' + SVG.play + '<span>试听</span></button> ' + uploadBtn + '</td>' +
    '</tr>';
  });

$('searchBody').addEventListener('click', async function(ev) {
  ev.stopPropagation();
  var tr = ev.target.closest('tr[data-idx]'); if (!tr) return;

async function uploadDirect(song, btn) {
  var br = qualityBr();
  var key = songKey(song.source, song.id);
  if (state.uploaded[key]) return;

  if (state.unavailable[key]) {
    toast('该音源未返回音频，请换音源或降低音质', 'error');
    return;
  }

  if (isTooBig(state.sizeCache[key])) {
    if (btn) {
      btn.className = 'btn-too-big btn-xs';
      btn.innerHTML = SVG.upload + '<span>过大</span>';
      btn.disabled = true;
      btn.removeAttribute('data-act');
    }
    toast('文件 ' + sizeLabel(state.sizeCache[key]) + '，超过 ' + MAX_UPLOAD_SIZE_MB + ' MB 上限', 'error');
    return;
  }

  if (btn) { btn.disabled = true; btn.innerHTML = SVG.upload + '<span>获取中…</span>'; }
  toast('正在获取音频直链…');

  try {
    var track = await gdTrackAll(song.source || 'netease', song.id, song.pic_id, song.lyric_id || song.id, br);

    if (track.unavailable || !track.url) {
      state.unavailable[key] = true;
      if (btn) {
        btn.className = 'btn-too-big btn-xs';
        btn.innerHTML = SVG.upload + '<span>无音频</span>';
        btn.disabled = true;
        btn.removeAttribute('data-act');
      }
      throw new Error('当前音源（' + sourceLabel(song.source) + '）未返回音频，可能是该音源不支持此音质「' + $('qualitySel').value + '」或曲目受限。换音源或降低音质试试');
    }

    if (track.size) state.sizeCache[key] = track.size;

    if (isTooBig(track.size)) {
      if (btn) {
        btn.className = 'btn-too-big btn-xs';
        btn.innerHTML = SVG.upload + '<span>过大</span>';
        btn.disabled = true;
        btn.removeAttribute('data-act');
      }
      throw new Error('文件 ' + sizeLabel(track.size) + '，超过 ' + MAX_UPLOAD_SIZE_MB + ' MB 上限（请换音源或降低音质）');
    }

    if (btn) { btn.innerHTML = SVG.upload + '<span>推送中…</span>'; }
    toast('正在推送到 GitHub…');

    var data = await api('/upload', 'POST', {
      source: song.source || 'netease',
      track_id: song.id,
      name: song.name,
      artist: fmtArtist(song.artist),
      audio_url: track.url,
      pic_url: track.pic_url || '',
      lyric: track.lyric || '',

      btn.disabled = false;
      btn.innerHTML = SVG.upload + '<span>上传</span>';
    }
    toast(friendlyError(e), 'error');
  }
}

function syncDetailUploadBtn() {
  var btn = $('uploadBtn'); if (!state.selected) return;
  var key = songKey(state.selected.source, state.selected.track_id);
  if (state.uploaded[key]) {
    btn.className = 'btn-uploaded';
    btn.innerHTML = SVG.check + '<span>已上传到歌单库</span>';
    btn.disabled = true;
    return;
  }
  if (state.unavailable[key]) {
    btn.className = 'btn-too-big';
    btn.innerHTML = SVG.upload + '<span>当前音源无音频</span>';
    btn.disabled = true;
    return;
  }
  if (isTooBig(state.sizeCache[key])) {
    btn.className = 'btn-too-big';
    btn.innerHTML = SVG.upload + '<span>文件过大（' + sizeLabel(state.sizeCache[key]) + '）</span>';
    btn.disabled = true;
    return;
  }
  btn.className = 'btn-primary';
  btn.innerHTML = SVG.upload + '<span>上传到歌单库</span>';
  btn.disabled = false;
}

function setListenTip(type, text) {
  var tip = $('listenTip');
  var txt = $('listenTipText');
  if (!tip || !txt) return;
  if (type === 'warn') {
    tip.className = 'listen-tip warn';

    tip.className = 'listen-tip';

async function selectSong(song) {
  $('detailCard').classList.remove('mobile-hidden');
  var br = qualityBr();
  state.selected = {
    source: song.source || 'netease', track_id: song.id, name: song.name,
    artist: fmtArtist(song.artist), pic_id: song.pic_id || '',
    lyric_id: song.lyric_id || song.id, br: br, quality: $('qualitySel').value,
  };

  $('detailEmpty').style.display = 'none'; $('detailContent').style.display = '';
  $('detailName').textContent = song.name || '—';
  $('detailArtist').innerHTML = SVG.mic + '<span>' + escapeHtml(fmtArtist(song.artist) || '—') + '</span>';
  $('detailSrc').textContent = song.source || '—';
  $('detailQ').textContent = $('qualitySel').value;
  $('uploadStatus').textContent = '正在加载歌曲信息…';
  $('lyricBox').innerHTML = '';
  var cover = $('detailCover'); cover.style.display = 'none'; cover.removeAttribute('src');
  $('detailCoverPh').style.display = '';
  setListenTip('normal');

  syncDetailUploadBtn();
  if (window.innerWidth <= 900) $('detailCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  try {
    var track = await gdTrackAll(song.source || 'netease', song.id, song.pic_id, song.lyric_id || song.id, br);

    var curKey = songKey(song.source, song.id);

    if (track.pic_url) { cover.src = track.pic_url; cover.style.display = ''; $('detailCoverPh').style.display = 'none'; }
    if (track.lyric) renderLyric(track.lyric);

    if (track.unavailable || !track.url) {
      state.unavailable[curKey] = true;

      var curTr = document.querySelector('#searchBody tr.selected');
      if (curTr && !state.uploaded[curKey]) {
        var upb = curTr.querySelector('button[data-act="upload"]');
        if (upb) {
          upb.className = 'btn-too-big btn-xs';
          upb.innerHTML = SVG.upload + '<span>无音频</span>';
          upb.disabled = true;
          upb.removeAttribute('data-act');
        }
      }

      var tipMsg = '当前音源（' + sourceLabel(song.source) + '）未返回播放地址，可能是该音源不支持此音质「' + $('qualitySel').value + '」或曲目受限。请换音源或降低音质。';
      $('uploadStatus').textContent = tipMsg;
      setListenTip('warn', '当前音源无可用音频，无法试听');
      toast('无可用音频：' + sourceLabel(song.source) + ' 未返回播放地址', 'error');
      syncDetailUploadBtn();
      return;
    }

    if (track.size) {
      state.sizeCache[curKey] = track.size;

      var curTr2 = document.querySelector('#searchBody tr.selected');
      if (curTr2 && isTooBig(track.size) && !state.uploaded[curKey]) {
        var upb2 = curTr2.querySelector('button[data-act="upload"]');
        if (upb2) {
          upb2.className = 'btn-too-big btn-xs';
          upb2.innerHTML = SVG.upload + '<span>过大</span>';
          upb2.disabled = true;
          upb2.removeAttribute('data-act');
        }
      }
    }
    syncDetailUploadBtn();
    setListenTip('normal');

    if (window.MusicPlayer) {
      window.MusicPlayer.loadTrack({
        id: curKey,
        name: song.name, artist: fmtArtist(song.artist),
        url: track.url, pic: track.pic_url || '',
      });
    }
    $('uploadStatus').textContent = '';
  } catch (e) {
    console.error('[select] 原始错误:', e);
    $('uploadStatus').textContent = friendlyError(e);
    setListenTip('warn', '加载失败：' + friendlyError(e));
  }
}

function renderLyric(lrc) {
  var lines = []; var pattern = /\[(\d+):(\d+\.?\d*)\](.*)/;
  lrc.split(/\r?\n/).forEach(function(line) {
    var m = line.trim().match(pattern);
    if (m) { var t = parseInt(m[1]) * 60 + parseFloat(m[2]); lines.push({ t: t, text: m[3].trim() }); }
  });
  lines.sort(function(a, b) { return a.t - b.t; });
  if (!lines.length) { $('lyricBox').innerHTML = ''; return; }
  var html = '<div class="lrc-wrap">';
  lines.forEach(function(l) { if (l.text) html += '<div class="lrc-line">' + escapeHtml(l.text) + '</div>'; });
  html += '</div>'; $('lyricBox').innerHTML = html;
}

$('uploadBtn').addEventListener('click', async function(ev) {
  ev.stopPropagation();
  if (!state.selected) { toast('请先选择歌曲', 'error'); return; }
  var key = songKey(state.selected.source, state.selected.track_id);
  if (state.uploaded[key]) { toast('该歌曲已上传', 'success'); return; }
  if (state.unavailable[key]) { toast('该音源未返回音频，请换音源或降低音质', 'error'); return; }

  var sel = state.selected;

  if (isTooBig(state.sizeCache[key])) {
    syncDetailUploadBtn();
    toast('文件 ' + sizeLabel(state.sizeCache[key]) + '，超过 ' + MAX_UPLOAD_SIZE_MB + ' MB 上限', 'error');
    return;
  }

  var btn = $('uploadBtn'); btn.disabled = true; btn.innerHTML = SVG.upload + '<span>获取中…</span>';
  $('uploadStatus').textContent = '正在获取音频直链…';
  try {
    var track = await gdTrackAll(sel.source, sel.track_id, sel.pic_id, sel.lyric_id, sel.br);

    if (track.unavailable || !track.url) {
      state.unavailable[key] = true;
      syncDetailUploadBtn();
      throw new Error('当前音源（' + sourceLabel(sel.source) + '）未返回音频，可能是该音源不支持此音质「' + $('qualitySel').value + '」或曲目受限。换音源或降低音质试试');
    }

    if (track.size) state.sizeCache[key] = track.size;
    if (isTooBig(track.size)) {
      syncDetailUploadBtn();
      throw new Error('文件 ' + sizeLabel(track.size) + '，超过 ' + MAX_UPLOAD_SIZE_MB + ' MB 上限（请换音源或降低音质）');
    }

    btn.innerHTML = SVG.upload + '<span>推送中…</span>';
    $('uploadStatus').textContent = '正在下载并推送到 GitHub，请稍候…';

    var data = await api('/upload', 'POST', {
      source: sel.source, track_id: sel.track_id, name: sel.name, artist: sel.artist,
      audio_url: track.url, pic_url: track.pic_url || '', lyric: track.lyric || '', br: sel.br,
    });
    state.uploaded[key] = true;
    markDirty(1);
    syncDetailUploadBtn();
    $('uploadStatus').textContent = data.message || '上传成功';
    toast((data.message || '上传成功') + '（记得点右上角「保存并部署」生效）', 'success');

    var tr = document.querySelector('#searchBody tr.selected');
    if (tr) {
      var upBtn = tr.querySelector('button[data-act="upload"]');
      if (upBtn) { upBtn.className = 'btn-uploaded btn-xs'; upBtn.innerHTML = SVG.check + '<span>已上传</span>'; upBtn.disabled = true; upBtn.removeAttribute('data-act'); }
    }
    loadLibrary();
  } catch (e) {
    console.error('[upload-detail] 原始错误:', e);
    var friendly = friendlyError(e);
    $('uploadStatus').textContent = friendly;
    toast(friendly, 'error');
    btn.disabled = false; btn.className = 'btn-primary'; btn.innerHTML = SVG.upload + '<span>上传到歌单库</span>';
    syncDetailUploadBtn();
  }
});

$('refreshLibBtn').addEventListener('click', loadLibrary);

async function loadLibrary() {
  $('libBody').innerHTML = '<tr><td colspan="6" class="empty">加载中…</td></tr>';
  try {
    var data = await api('/library', 'GET');
    state.library = data.list || [];
    renderLibrary();
    if (window.MusicPlayer && typeof window.MusicPlayer.setLibrary === 'function') window.MusicPlayer.setLibrary(state.library);
    state.library.forEach(function(s) { state.uploaded[songKey(s.source, s.id)] = true; });
    if (state.results.length) renderSearch();
    if (state.selected) syncDetailUploadBtn();
  } catch (e) {
    console.error('[library] 原始错误:', e);
    $('libBody').innerHTML = '<tr><td colspan="6" class="empty">' + friendlyError(e) + '</td></tr>';
    $('libStatus').textContent = '';
  }
}

function renderLibrary() {
  var tb = $('libBody');
  $('libStatus').textContent = '共 ' + state.library.length + ' 首';
  if (!state.library.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">歌单为空，去搜索页面添加吧</td></tr>'; return; }

  var html = '';
  var total = state.library.length;

  // 反序遍历：新上传的歌 append 到末尾，反序后显示在最上面
  for (var i = total - 1; i >= 0; i--) {
    var s = state.library[i];
    var artist = fmtArtist(s.artist);
    var displayNo = total - i;
    html += '<tr data-idx="' + i + '">' +
      '<td>' + displayNo + '</td>' +
      '<td class="song-cell">' +
        '<div class="song-title">' + escapeHtml(s.name) + '</div>' +
        '<div class="song-artist-m">' + escapeHtml(artist) + '</div>' +
      '</td>' +
      '<td>' + escapeHtml(artist) + '</td>' +
      '<td><span class="badge badge-src">' + escapeHtml(s.source || '') + '</span></td>' +
      '<td class="mono">' + escapeHtml(s.id) + '</td>' +
      '<td><button class="btn-danger btn-xs" data-act="del" data-idx="' + i + '">' + SVG.trash + '<span>删除</span></button></td>' +
    '</tr>';
  }
  tb.innerHTML = html;
}

$('libBody').addEventListener('click', async function(ev) {
  ev.stopPropagation();

  // ─── 点删除按钮：走删除逻辑 ───
  var delBtn = ev.target.closest('button[data-act="del"]');
  if (delBtn) {
    var idx = parseInt(delBtn.dataset.idx);
    var song = state.library[idx];
    if (!song) return;

    var ok = await showConfirm(
      '《' + escapeHtml(song.name) + ' - ' + escapeHtml(fmtArtist(song.artist)) + '》\n将同时删除 GitHub 上的音频、封面和歌词文件，此操作不可撤销。',
      { title: '确认删除这首歌？', okText: '确认删除', cancelText: '取消', danger: true }
    );
    if (!ok) return;

    delBtn.disabled = true; delBtn.innerHTML = SVG.trash + '<span>删除中…</span>';
    try {
      var data = await api('/delete', 'POST', { track_id: song.id, source: song.source });
      toast(data.message || '删除成功', 'success');
      delete state.uploaded[songKey(song.source, song.id)];
      markDirty(1);
      if (data.errors && data.errors.length) { console.warn('部分文件删除失败:', data.errors); toast('索引已删除，但部分文件删除失败', 'error'); }
      loadLibrary();
    } catch (e) {
      console.error('[delete] 原始错误:', e);
      toast(friendlyError(e), 'error');
      delBtn.disabled = false; delBtn.innerHTML = SVG.trash + '<span>删除</span>';
    }
    return;
  }

  // ─── 点行其它位置：播放 ───
  var tr = ev.target.closest('tr[data-idx]');
  if (!tr) return;
  var playIdx = parseInt(tr.dataset.idx);
  var s = state.library[playIdx];
  if (!s) return;

  if (!s.url) {
    toast('这首歌暂无可用播放链接', 'error');
    return;
  }

  document.querySelectorAll('#libBody tr').forEach(function(t) { t.classList.remove('selected'); });
  tr.classList.add('selected');

  // 探测资源是真的音频还是 Pages 的 HTML fallback
  var probeOk = true;
  try {
    var headResp = await fetch(s.url, { method: 'HEAD', cache: 'no-store' });
    var ct = (headResp.headers.get('Content-Type') || '').toLowerCase();
    if (!headResp.ok) {
      probeOk = false;
      toast('《' + s.name + '》资源不可用（HTTP ' + headResp.status + '）', 'error');
    } else if (ct.indexOf('text/html') >= 0) {
      probeOk = false;
      toast('《' + s.name + '》资源尚未部署，点「保存并部署」后 1-3 分钟生效', 'error');
    }
  } catch (e) {
    probeOk = false;
    toast('无法访问《' + s.name + '》资源：' + (e.message || String(e)), 'error');
  }
  if (!probeOk) return;

  if (window.MusicPlayer) {
    window.MusicPlayer.loadTrack({
      id: songKey(s.source, s.id),
      name: s.name,
      artist: fmtArtist(s.artist),
      url: s.url,
      pic: s.pic || ''
    });
  }
});

(async function init() {
  if (isMobile()) $('detailCard').classList.add('mobile-hidden');
  updateRateUI();
  setInterval(updateRateUI, 1000);
  loadDirtyState();
  var pwd = getToken();
  if (!pwd) { showLogin(); return; }
  try {
    var r = await fetch('/api/library', { headers: { 'X-Auth-Token': pwd } });
    if (r.status === 401) { clearToken(); showLogin(); return; }
    hideLogin();
    await loadLibrary();

    // ★ 加载歌单后，从 CDN 探测真实部署状态（不依赖 localStorage）
    await syncDirtyFromServer();
  } catch (e) { showLogin(); }
})();
</script>
