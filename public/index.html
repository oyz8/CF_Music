  var player = document.createElement('div'); player.className = 'music-player collapsed';
  var panel = document.createElement('div'); panel.className = 'mp-panel';
  var shimmer = document.createElement('div'); shimmer.className = 'mp-shimmer'; panel.appendChild(shimmer);
  var disc = document.createElement('div'); disc.className = 'mp-disc';
  var discRotating = document.createElement('div'); discRotating.className = 'mp-disc-rotating';
  var discBase = document.createElement('div'); discBase.className = 'mp-disc-base';
  var discImg = Object.assign(document.createElement('img'), { className: 'mp-disc-img' });
  discImg.style.display = 'none';
  discRotating.append(discBase, discImg); disc.append(discRotating);
  var infoWrap = document.createElement('div'); infoWrap.className = 'mp-info';
  var trackInfo = document.createElement('div'); trackInfo.className = 'mp-track';
  trackInfo.innerHTML = '<div class="mp-title">未播放</div><div class="mp-artist">' + CFG.title + '</div>';
  var progressWrap = document.createElement('div'); progressWrap.className = 'mp-progress';
  var bar = document.createElement('div'); bar.className = 'mp-bar'; bar.innerHTML = '<div class="mp-fill"></div>';
  var timeRow = document.createElement('div'); timeRow.className = 'mp-time';
  timeRow.innerHTML = '<span class="mp-cur">0:00</span><span class="mp-dur">0:00</span>';
  progressWrap.append(bar, timeRow);
  var controls = document.createElement('div'); controls.className = 'mp-controls';
  function mkBtn(svg, cls) { var b = document.createElement('button'); b.className = ('mp-btn ' + (cls || '')).trim(); b.innerHTML = svg; return b; }
  var prevBtn = mkBtn(ICON.prev), playBtn = mkBtn(ICON.play, 'play'), nextBtn = mkBtn(ICON.next),
      modeBtn = mkBtn(ICON.shuffle, 'active'),
      listBtn = mkBtn(ICON.list), volBtn = mkBtn(ICON.vol);
  var volSlider = document.createElement('div'); volSlider.className = 'mp-vol-slider';
  volSlider.innerHTML = '<input type="range" min="0" max="100">';
  var volInput = volSlider.querySelector('input');
  var volWrap = document.createElement('div'); volWrap.className = 'mp-vol-wrap';
  volWrap.append(volBtn, volSlider);
  controls.append(prevBtn, playBtn, nextBtn, modeBtn, listBtn, volWrap);
  infoWrap.append(trackInfo, progressWrap, controls);
  panel.append(disc, infoWrap);
  var ball = document.createElement('div'); ball.className = 'mp-ball';
  var ballWaves = document.createElement('div'); ballWaves.className = 'mp-ball-waves';
  for (var i = 0; i < 3; i++) {
    var w = document.createElement('div'); w.className = 'mp-ball-wave';
    w.style.animationDelay = (i * CFG.waveSpeed / 3) + 's';
    ballWaves.appendChild(w);
  }
  var ballInner = document.createElement('div'); ballInner.className = 'mp-ball-inner';
  var ballBase = document.createElement('div'); ballBase.className = 'mp-ball-base';
  var ballImg = Object.assign(document.createElement('img'), { className: 'mp-ball-img' });
  ballImg.style.display = 'none';
  ballInner.append(ballBase, ballImg);
  var ballOverlay = document.createElement('div'); ballOverlay.className = 'mp-ball-overlay';
  ballOverlay.innerHTML = ICON.play;
  ball.append(ballWaves, ballInner, ballOverlay);
  player.append(panel, ball); document.body.appendChild(player);
  var plPanel = document.createElement('div'); plPanel.className = 'mp-playlist';
  plPanel.innerHTML = '<div class="mp-pl-header"><span>播放列表</span><i class="mp-pl-close">' + ICON.close + '</i></div><div class="mp-pl-inner"><div class="mp-pl-content"></div></div>';
  document.body.appendChild(plPanel);
  var plContent = plPanel.querySelector('.mp-pl-content'), plCloseBtn = plPanel.querySelector('.mp-pl-close');
  var audio = new Audio(); audio.volume = CFG.defaultVolume; volInput.value = audio.volume * 100;
  var playing = false, expanded = false, plVisible = false, playlist = [], curIdx = 0, rotAngle = 0, rafId = null,
      lastVol = CFG.defaultVolume, ballDimTimer = null, autoCollapseTimer = null, panelHideTimer = null;

  var playMode = 'shuffle';
  try {
    var stored = localStorage.getItem('cf-music-playmode');
    if (stored === 'order' || stored === 'shuffle') playMode = stored;
  } catch (_) {}

  function updateModeBtn() {
    modeBtn.innerHTML = (playMode === 'shuffle') ? ICON.shuffle : ICON.order;
    modeBtn.classList.add('active');
    modeBtn.title = (playMode === 'shuffle') ? '随机播放（点击切换顺序）' : '顺序播放（点击切换随机）';
  }
  updateModeBtn();

  function fmt(s) { if (isNaN(s)) return '0:00'; var m = Math.floor(s / 60), sec = Math.floor(s % 60); return m + ':' + (sec < 10 ? '0' : '') + sec; }
  function stopProp(e) { e.stopPropagation(); }
  function songKey(source, id) { return (source || '') + ':' + (id || ''); }
  function scheduleBallDim() { clearTimeout(ballDimTimer); ballDimTimer = setTimeout(function() { if (!expanded) ball.classList.add('dim'); }, BDD); }
  function cancelBallDim() { clearTimeout(ballDimTimer); ball.classList.remove('dim'); }
  function scheduleAutoCollapse() { clearTimeout(autoCollapseTimer); autoCollapseTimer = setTimeout(function() { if (expanded && !plVisible) collapse(); }, CFG.autoCollapseDelay); }
  function cancelAutoCollapse() { clearTimeout(autoCollapseTimer); }
  function applyTheme() {
    var dark = document.documentElement.classList.contains('dark')
      || document.documentElement.getAttribute('data-theme') === 'dark'
      || window.matchMedia('(prefers-color-scheme: dark)').matches;
    var vars = {
      '--slider-bg': dark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.08)',
      '--slider-fill': dark ? '#2dd4bf' : '#0f766e',
      '--slider-thumb': dark ? '#2dd4bf' : '#0f766e',
      '--wave-color': dark ? 'rgba(45,212,191,0.55)' : 'rgba(15,118,110,0.45)',
      '--progress-bg': dark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.08)',
      '--progress-fill': dark ? '#2dd4bf' : '#0f766e',
    };
    Object.keys(vars).forEach(function(k) { player.style.setProperty(k, vars[k]); });
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
  function repositionPlaylist() {
    if (!plVisible) return;
    var r = listBtn.getBoundingClientRect(), PW = 280;
    var left = Math.max(10, Math.min(r.left + r.width / 2 - PW / 2, window.innerWidth - PW - 10));
    var bottom = Math.max(10, window.innerHeight - r.top + 8);
    plPanel.style.left = left + 'px'; plPanel.style.bottom = bottom + 'px'; plPanel.style.top = 'auto';
  }
  window.addEventListener('resize', repositionPlaylist);
  window.addEventListener('scroll', repositionPlaylist, true);
  function renderList() {
    if (!playlist.length) { plContent.innerHTML = '<div style="padding:20px;text-align:center;opacity:.6;">播放列表为空</div>'; return; }
    plContent.innerHTML = playlist.map(function(t, i) {
      return '<div class="mp-pl-item' + (i === curIdx ? ' active' : '') + '" data-i="' + i + '">' + (i + 1) + '. ' + t.name + ' - ' + t.artist + '</div>';
    }).join('');
    plContent.querySelectorAll('.mp-pl-item').forEach(function(el) {
      el.onclick = function(e) { stopProp(e); loadTrack(parseInt(el.dataset.i)); if (playing) audioPlay(); togglePlaylist(); };
    });
  }
  function loadTrack(idx) {
    if (!playlist.length) return;
    curIdx = idx; var t = playlist[idx];
    setInfo({ title: t.name + ' (加载中…)', artist: t.artist });
    plContent.querySelectorAll('.mp-pl-item').forEach(function(el, i) { el.classList.toggle('active', i === idx); });
    if (!t.url) { nextTrack(); return; }
    audio.src = t.url;
    setInfo({ title: t.name, artist: t.artist, cover: t.pic || '' });
  }
  function setInfo(o) {
    if (o.title) trackInfo.querySelector('.mp-title').textContent = o.title;
    if (o.artist) trackInfo.querySelector('.mp-artist').textContent = o.artist;

    if (o.cover === undefined) return;

    var cover = o.cover || '';
    if (cover) {
      discImg.onerror = function() { discImg.onerror = null; discImg.src = DEFAULT_COVER; };
      ballImg.onerror = function() { ballImg.onerror = null; ballImg.src = DEFAULT_COVER; };
      discImg.src = cover;
      ballImg.src = cover;
    } else {
      discImg.onerror = null;
      ballImg.onerror = null;
      discImg.src = DEFAULT_COVER;
      ballImg.src = DEFAULT_COVER;
    }
    discImg.style.display = 'block';
    ballImg.style.display = 'block';
  }
  function audioPlay() { audio.play().catch(function() { setPlaying(false); }); setPlaying(true); }
  function audioPause() { audio.pause(); setPlaying(false); }

  function pickShuffleIdx(exclude) {
    if (playlist.length <= 1) return 0;
    var n;
    do { n = Math.floor(Math.random() * playlist.length); } while (n === exclude);
    return n;
  }
  function prevTrack() {
    if (!playlist.length) return;
    if (playMode === 'shuffle') curIdx = pickShuffleIdx(curIdx);
    else curIdx = (curIdx - 1 + playlist.length) % playlist.length;
    loadTrack(curIdx); if (playing) audioPlay();
  }
  function nextTrack() {
    if (!playlist.length) return;
    if (playMode === 'shuffle') curIdx = pickShuffleIdx(curIdx);
    else curIdx = (curIdx + 1) % playlist.length;
    loadTrack(curIdx); if (playing) audioPlay();
  }

  function setPlaying(s) {
    playing = s; var icon = s ? ICON.pause : ICON.play;
    playBtn.innerHTML = icon; ballOverlay.innerHTML = icon;
    player.classList.toggle('playing', s);
    if (s && !rafId) startRotation();
    if (!s && rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }
  function startRotation() {
    var step = 360 / (CFG.rotationSpeed * 60);
    function tick() { if (!playing) { rafId = null; return; } rotAngle += step; discRotating.style.transform = 'rotate(' + rotAngle + 'deg)'; ballInner.style.transform = 'rotate(' + rotAngle + 'deg)'; rafId = requestAnimationFrame(tick); }
    rafId = requestAnimationFrame(tick);
  }
  audio.ontimeupdate = function() {
    var c = audio.currentTime, d = audio.duration; if (!d || isNaN(d)) return;
    player.querySelector('.mp-fill').style.width = (c / d * 100) + '%';
    timeRow.querySelector('.mp-cur').textContent = fmt(c);
    timeRow.querySelector('.mp-dur').textContent = fmt(d);
  };
  audio.onloadedmetadata = audio.ontimeupdate;
  audio.onended = nextTrack;
  audio.onerror = function() { setPlaying(false); };
  function expand(bindOutside) {
    clearTimeout(panelHideTimer);
    if (panel.style.display === 'none') { panel.style.display = ''; void panel.offsetWidth; }
    expanded = true; player.classList.remove('collapsed'); cancelBallDim();
    document.removeEventListener('click', onOutsideClick);
    if (bindOutside) setTimeout(function() { document.addEventListener('click', onOutsideClick); }, 0);
  }
  function onVolOutside(e) {
    if (!volWrap.contains(e.target)) {
      volSlider.classList.remove('show');
      document.removeEventListener('click', onVolOutside);
    }
  }
  function collapse() {
    clearTimeout(autoCollapseTimer);
    if (plVisible) { plVisible = false; plPanel.classList.remove('show'); document.removeEventListener('click', onPlOutside); }
    volSlider.classList.remove('show'); document.removeEventListener('click', onVolOutside);
    expanded = false; player.classList.add('collapsed');
    document.removeEventListener('click', onOutsideClick);
    applyTheme(); scheduleBallDim();
    clearTimeout(panelHideTimer);
    panelHideTimer = setTimeout(function() { if (player.classList.contains('collapsed')) panel.style.display = 'none'; }, 1000);
  }
  function onOutsideClick(e) {
    if (e.target.closest && (e.target.closest('#panel-results') || e.target.closest('#panel-library') || e.target.closest('.search-panel') || e.target.closest('.detail-panel') || e.target.closest('#loginOverlay') || e.target.closest('#modalOverlay'))) return;
    if (player.contains(e.target) || plPanel.contains(e.target)) return;
    collapse();
  }
  function togglePlaylist() {
    plVisible = !plVisible; plPanel.classList.toggle('show', plVisible);
    if (plVisible) { cancelAutoCollapse(); repositionPlaylist(); setTimeout(function() { document.addEventListener('click', onPlOutside); }, 0); }
    else { document.removeEventListener('click', onPlOutside); if (expanded) scheduleAutoCollapse(); }
  }
  function onPlOutside(e) { if (!plPanel.contains(e.target) && !listBtn.contains(e.target)) togglePlaylist(); }
  function syncVolumeUI() { player.style.setProperty('--slider-pct', volInput.value + '%'); volBtn.innerHTML = audio.volume === 0 ? ICON.mute : ICON.vol; }
  disc.onclick = function(e) { stopProp(e); playing ? audioPause() : audioPlay(); };
  ball.onclick = function(e) {
    stopProp(e); if (expanded) return;
    var rect = ball.getBoundingClientRect(), cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    var dx = e.clientX - cx, dy = e.clientY - cy, dist = Math.sqrt(dx * dx + dy * dy);
    if (dist <= CFG.ballCoverSize / 2) { playing ? audioPause() : audioPlay(); }
    else { expand(true); scheduleAutoCollapse(); }
  };
  playBtn.onclick = function(e) { stopProp(e); playing ? audioPause() : audioPlay(); };
  prevBtn.onclick = function(e) { stopProp(e); prevTrack(); };
  nextBtn.onclick = function(e) { stopProp(e); nextTrack(); };
  modeBtn.onclick = function(e) {
    stopProp(e);
    playMode = (playMode === 'shuffle') ? 'order' : 'shuffle';
    try { localStorage.setItem('cf-music-playmode', playMode); } catch (_) {}
    updateModeBtn();
    if (typeof toast === 'function') toast(playMode === 'shuffle' ? '随机播放' : '顺序播放');
  };
  listBtn.onclick = function(e) { stopProp(e); togglePlaylist(); };
  plCloseBtn.onclick = function(e) { stopProp(e); togglePlaylist(); };

  volSlider.addEventListener('mousedown', stopProp);
  volSlider.addEventListener('touchstart', stopProp);
  volBtn.onclick = function(e) {
    stopProp(e);
    var open = volSlider.classList.toggle('show');
    if (open) setTimeout(function() { document.addEventListener('click', onVolOutside); }, 0);
    else document.removeEventListener('click', onVolOutside);
  };
  volInput.oninput = function(e) { stopProp(e); audio.volume = e.target.value / 100; if (audio.volume > 0) lastVol = audio.volume; syncVolumeUI(); };
  bar.onclick = function(e) {
    stopProp(e); if (!audio.duration || isNaN(audio.duration)) return;
    var r = bar.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  };
  player.addEventListener('mouseenter', cancelAutoCollapse);
  player.addEventListener('mousedown', cancelAutoCollapse);
  player.addEventListener('mouseleave', function() { if (expanded && !plVisible) scheduleAutoCollapse(); });
  var mob = window.innerWidth <= 768;
  player.style.setProperty('--wave-stroke', mob ? CFG.waveMobileStroke : CFG.waveStroke);
  player.style.setProperty('--wave-speed', CFG.waveSpeed + 's');
  player.style.setProperty('--wave-scale', String(CFG.waveScale));
  player.style.setProperty('--slider-pct', (audio.volume * 100) + '%');
  applyTheme(); syncVolumeUI(); renderList();

  function setLibrary(lib) {
    if (!Array.isArray(lib)) return;
    var libUrls = {}, newTracks = [];
    lib.forEach(function(s) {
      if (!s.url) return;
      libUrls[s.url] = true;
      newTracks.push({ id: songKey(s.source, s.id), name: s.name || '未知歌曲', artist: s.artist || '', url: s.url, pic: s.pic || '' });
    });
    playlist.forEach(function(t) { if (!libUrls[t.url]) { newTracks.push(t); libUrls[t.url] = true; } });
    playlist = newTracks;

    if (!playlist.length) { curIdx = 0; renderList(); return; }

    var curUrl = audio.getAttribute('src') || '';
    if (!curUrl) {
      var randIdx = Math.floor(Math.random() * playlist.length);
      curIdx = randIdx;
      loadTrack(randIdx);
    } else {
      var found = -1;
      for (var i = 0; i < playlist.length; i++) if (playlist[i].url === curUrl) { found = i; break; }
      if (found >= 0) curIdx = found;
      else if (curIdx >= playlist.length) curIdx = 0;
    }
    renderList();
  }
  function playExternal(track) {
    if (!track || !track.url) return;
    var idx = -1;
    for (var i = 0; i < playlist.length; i++) if (playlist[i].url === track.url) { idx = i; break; }
    if (idx >= 0) curIdx = idx;
    else { playlist.push({ id: track.id || ('ext_' + Date.now()), name: track.name || '未知歌曲', artist: track.artist || CFG.title, url: track.url, pic: track.pic || '' }); curIdx = playlist.length - 1; }
    renderList(); loadTrack(curIdx); audioPlay();
    if (!expanded) expand(true);
    scheduleAutoCollapse(); scheduleBallDim();
  }
  window.MusicPlayer = {
    loadTrack: playExternal,
    play: playExternal,
    setLibrary: setLibrary,
    expand: function() { expand(false); scheduleAutoCollapse(); },
    collapse: function() { collapse(); }
  };
})();
